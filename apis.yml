name: Livsn Designs
description: >-
  Livsn Designs is a Techstars-backed outdoor apparel brand that makes durable,
  minimalist technical clothing (its Flex Canvas pants and multi-use travel and
  hiking apparel) sold direct-to-consumer from a Shopify storefront at
  livsndesigns.com. It publishes no first-party developer API or documentation
  portal. Its only programmatic surface is the agent-commerce layer Shopify
  serves on the merchant's own domain: a Universal Commerce Protocol (UCP)
  shopping MCP endpoint for agent-driven checkout, a Shopify Customer Account
  OIDC/OAuth2 authorization server, and an llms.txt / agents.md agent-instructions
  document. This profile captures that real agent surface; there is no bespoke
  API to catalog.
